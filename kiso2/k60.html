<h3>課題６０</h3>

<hr>

<ol>

<li>借金を pv、利率を i、返済回数を n としたとき、
月々の返済額 p は次の式で計算することができます。

<blockquote>
p = pv * i / (1 - (1 + i)<sup>-n</sup>)
</blockquote>

<li>pv, i, n を入力すれば、
月々の返済額を計算してくれるプログラムを作ってください。
<p>

<li>ソースプログラムのファイル名は kadai60.c とし、
それをメールで
<a href="mailto:tokoi@center.wakayama-u.ac.jp">tokoi</a>まで送ってください。
Subject: は kadai60 としてください。

</ol>
